<!DOCTYPE html>
<html>
<head>
    <title>APK Download with Progress %</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial; padding: 20px; background: #f5f5f5; }
        .container { max-width: 400px; margin: 40px auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
        h3 { color: #333; margin-bottom: 20px; text-align: center; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 2px solid #ddd; border-radius: 8px; font-size: 16px; }
        .progress-container { margin: 20px 0; }
        .progress-bar { height: 8px; background: #eee; border-radius: 4px; overflow: hidden; display: none; }
        .progress { height: 100%; background: linear-gradient(90deg, #4CAF50, #8BC34A); width: 0%; transition: width 0.3s; }
        .progress-text { text-align: center; font-size: 14px; margin-top: 8px; color: #666; display: none; }
        button { width: 100%; padding: 16px; background: #4CAF50; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.3s; margin-top: 10px; }
        button:hover { background: #45a049; }
        button:disabled { background: #cccccc; cursor: not-allowed; }
        .status { margin-top: 15px; padding: 12px; border-radius: 8px; display: none; text-align: center; }
        .success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .loading { background: #fff3cd; color: #856404; border: 1px solid #ffeaa7; }
        .error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    </style>
</head>
<body>
    <div class="container">
        <h3>📱 APK Download</h3>
        
        <input type="text" id="fileName" 
               placeholder="Enter filename (e.g., MyApp)" 
               value="MyApp">
        
        <div class="progress-container">
            <div class="progress-bar" id="progressBar">
                <div class="progress" id="progress"></div>
            </div>
            <div class="progress-text" id="progressText"></div>
        </div>
        
        <button id="downloadBtn" onclick="startDownload()">⬇️ Download APK</button>
        
        <div class="status" id="status"></div>
    </div>

    <script>
    let isDownloading = false;
    const apkUrl = 'app.apk'; // यहाँ अपने APK का filename डालें

    async function startDownload() {
        if (isDownloading) return;
        
        const input = document.getElementById('fileName').value.trim();
        if (!input) {
            showStatus('Please enter a filename', 'error');
            return;
        }
        
        const fileName = input.endsWith('.apk') ? input : input + '.apk';
        showStatus('Starting download...', 'loading');
        
        // Disable button and show progress
        isDownloading = true;
        document.getElementById('downloadBtn').disabled = true;
        document.getElementById('downloadBtn').textContent = 'Downloading...';
        
        document.getElementById('progressBar').style.display = 'block';
        document.getElementById('progressText').style.display = 'block';
        document.getElementById('progressText').textContent = '0% (0 KB)';
        
        try {
            // Fetch file with progress tracking
            const response = await fetch(apkUrl);
            const contentLength = response.headers.get('content-length');
            const total = parseInt(contentLength, 10);
            
            let loaded = 0;
            const reader = response.body.getReader();
            const chunks = [];
            
            while(true) {
                const {done, value} = await reader.read();
                if (done) break;
                
                chunks.push(value);
                loaded += value.length;
                
                // Update progress bar and text
                if (total) {
                    const percent = Math.round((loaded / total) * 100);
                    document.getElementById('progress').style.width = percent + '%';
                    
                    // Format sizes
                    const loadedKB = (loaded / 1024).toFixed(1);
                    const totalKB = (total / 1024).toFixed(1);
                    document.getElementById('progressText').textContent = 
                        `${percent}% (${loadedKB} KB / ${totalKB} KB)`;
                } else {
                    // If total size unknown
                    const loadedKB = (loaded / 1024).toFixed(1);
                    document.getElementById('progressText').textContent = 
                        `Downloaded: ${loadedKB} KB`;
                }
            }
            
            // Create blob from chunks
            const blob = new Blob(chunks);
            
            // Final 100% display
            if (total) {
                const totalKB = (total / 1024).toFixed(1);
                const totalMB = (total / (1024 * 1024)).toFixed(2);
                
                document.getElementById('progressText').textContent = 
                    total > 1024 * 1024 ? 
                    `✅ 100% Complete (${totalMB} MB)` : 
                    `✅ 100% Complete (${totalKB} KB)`;
                
                document.getElementById('progress').style.width = '100%';
                document.getElementById('progress').style.background = '#4CAF50';
            }
            
            // Download the file
            downloadFile(blob, fileName);
            
            // Show success message
            showStatus(`✅ Download complete: ${fileName}`, 'success');
            
        } catch (error) {
            showStatus('❌ Error: ' + error.message, 'error');
            resetButton();
        } finally {
            resetButton();
        }
    }

    function downloadFile(blob, fileName) {
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = fileName;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(link.href);
    }

    function resetButton() {
        isDownloading = false;
        document.getElementById('downloadBtn').disabled = false;
        document.getElementById('downloadBtn').textContent = '⬇️ Download APK';
    }

    function showStatus(message, type) {
        const statusDiv = document.getElementById('status');
        statusDiv.textContent = message;
        statusDiv.className = 'status ' + type;
        statusDiv.style.display = 'block';
    }

    // Enter key support
    document.getElementById('fileName').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') startDownload();
    });
    </script>
</body>
</html>
