<!DOCTYPE html>
<html>
<head>
    <title>APK Download with Custom URL</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial; padding: 20px; background: #f5f5f5; }
        .container { max-width: 500px; margin: 30px auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
        h3 { color: #333; margin-bottom: 20px; text-align: center; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: bold; color: #555; }
        input { width: 100%; padding: 12px; border: 2px solid #ddd; border-radius: 8px; font-size: 16px; }
        input:focus { border-color: #4CAF50; outline: none; }
        .progress-container { margin: 20px 0; }
        .progress-bar { height: 8px; background: #eee; border-radius: 4px; overflow: hidden; display: none; }
        .progress { height: 100%; background: linear-gradient(90deg, #4CAF50, #8BC34A); width: 0%; transition: width 0.3s; }
        .progress-text { text-align: center; font-size: 14px; margin-top: 8px; color: #666; display: none; }
        button { width: 100%; padding: 16px; background: #4CAF50; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        button:hover { background: #45a049; }
        button:disabled { background: #cccccc; cursor: not-allowed; }
        .status { margin-top: 20px; padding: 12px; border-radius: 8px; display: none; text-align: center; }
        .success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .loading { background: #fff3cd; color: #856404; border: 1px solid #ffeaa7; }
        .error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .info { background: #d1ecf1; color: #0c5460; border: 1px solid #bee5eb; font-size: 14px; margin-top: 15px; padding: 10px; border-radius: 6px; }
        .example-url { font-size: 12px; color: #666; margin-top: 5px; }
    </style>
</head>
<body>
    <div class="container">
        <h3>📱 APK Downloader</h3>
        
        <div class="form-group">
            <label for="apkUrl">APK File URL:</label>
            <input type="url" id="apkUrl" 
                   placeholder="https://myhouselifebed.in/down/app.apk"
                   value="app.apk">
            <div class="example-url">Example: https://yourwebsite.com/files/myapp.apk</div>
        </div>
        
        <div class="form-group">
            <label for="fileName">Download Filename:</label>
            <input type="text" id="fileName" 
                   placeholder="Enter filename (e.g., MyApp)" 
                   value="MyApp">
            <div class="example-url">.apk extension will be added automatically</div>
        </div>
        
        <div class="progress-container">
            <div class="progress-bar" id="progressBar">
                <div class="progress" id="progress"></div>
            </div>
            <div class="progress-text" id="progressText"></div>
        </div>
        
        <button id="downloadBtn" onclick="startDownload()">⬇️ Download APK</button>
        
        <div class="info">
            <strong>Note:</strong> Enter the direct download URL of the APK file above. 
            Make sure the URL ends with .apk extension.
        </div>
        
        <div class="status" id="status"></div>
    </div>

    <script>
    let isDownloading = false;

    async function startDownload() {
        if (isDownloading) return;
        
        const apkUrl = document.getElementById('apkUrl').value.trim();
        const input = document.getElementById('fileName').value.trim();
        
        // Validate inputs
        if (!apkUrl) {
            showStatus('Please enter APK file URL', 'error');
            return;
        }
        
        if (!input) {
            showStatus('Please enter a filename', 'error');
            return;
        }
        
        // Ensure URL is valid
        if (!apkUrl.startsWith('http://') && !apkUrl.startsWith('https://') && !apkUrl.endsWith('.apk')) {
            if (!apkUrl.includes('/')) {
                // Assume it's a local file
                showStatus('Downloading local file: ' + apkUrl, 'loading');
            } else {
                showStatus('Please enter a valid URL starting with http:// or https://', 'error');
                return;
            }
        }
        
        const fileName = input.endsWith('.apk') ? input : input + '.apk';
        showStatus('Connecting to server...', 'loading');
        
        // Disable button and show progress
        isDownloading = true;
        document.getElementById('downloadBtn').disabled = true;
        document.getElementById('downloadBtn').textContent = 'Downloading...';
        
        document.getElementById('progressBar').style.display = 'block';
        document.getElementById('progressText').style.display = 'block';
        document.getElementById('progressText').textContent = '0% (Connecting...)';
        
        try {
            // Fetch file with progress tracking
            const response = await fetch(apkUrl);
            
            if (!response.ok) {
                throw new Error(`Server error: ${response.status} ${response.statusText}`);
            }
            
            const contentLength = response.headers.get('content-length');
            const total = contentLength ? parseInt(contentLength, 10) : null;
            
            let loaded = 0;
            const reader = response.body.getReader();
            const chunks = [];
            
            while(true) {
                const {done, value} = await reader.read();
                if (done) break;
                
                chunks.push(value);
                loaded += value.length;
                
                // Update progress bar and text
                if (total) {
                    const percent = Math.round((loaded / total) * 100);
                    document.getElementById('progress').style.width = percent + '%';
                    
                    // Format sizes
                    const loadedKB = (loaded / 1024).toFixed(1);
                    const totalKB = (total / 1024).toFixed(1);
                    document.getElementById('progressText').textContent = 
                        `${percent}% (${loadedKB} KB / ${totalKB} KB)`;
                } else {
                    // If total size unknown
                    const loadedKB = (loaded / 1024).toFixed(1);
                    const percent = loaded > 0 ? Math.min(95, (loaded / (1024 * 1024)) * 100) : 0; // Estimate
                    document.getElementById('progress').style.width = percent + '%';
                    document.getElementById('progressText').textContent = 
                        `Downloaded: ${loadedKB} KB`;
                }
            }
            
            // Create blob from chunks
            const blob = new Blob(chunks);
            
            // Check if it's actually an APK file
            if (blob.size < 1024) {
                throw new Error('File too small. Might not be a valid APK.');
            }
            
            // Final 100% display
            document.getElementById('progress').style.width = '100%';
            document.getElementById('progress').style.background = '#4CAF50';
            
            if (total) {
                const totalKB = (total / 1024).toFixed(1);
                const totalMB = (total / (1024 * 1024)).toFixed(2);
                
                document.getElementById('progressText').textContent = 
                    total > 1024 * 1024 ? 
                    `✅ 100% Complete (${totalMB} MB)` : 
                    `✅ 100% Complete (${totalKB} KB)`;
            } else {
                const totalSize = (blob.size / 1024).toFixed(1);
                document.getElementById('progressText').textContent = 
                    `✅ 100% Complete (${totalSize} KB)`;
            }
            
            // Download the file
            downloadFile(blob, fileName);
            
            // Show success message
            showStatus(`✅ Download complete: ${fileName} (${formatFileSize(blob.size)})`, 'success');
            
        } catch (error) {
            showStatus('❌ Error: ' + error.message, 'error');
            console.error('Download error:', error);
        } finally {
            resetButton();
        }
    }

    function downloadFile(blob, fileName) {
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = fileName;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(link.href);
    }

    function formatFileSize(bytes) {
        if (bytes < 1024) return bytes + ' bytes';
        if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
        return (bytes / (1024 * 1024)).toFixed(2) + ' MB';
    }

    function resetButton() {
        isDownloading = false;
        document.getElementById('downloadBtn').disabled = false;
        document.getElementById('downloadBtn').textContent = '⬇️ Download APK';
    }

    function showStatus(message, type) {
        const statusDiv = document.getElementById('status');
        statusDiv.textContent = message;
        statusDiv.className = 'status ' + type;
        statusDiv.style.display = 'block';
    }

    // Enter key support
    document.getElementById('fileName').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') startDownload();
    });
    
    document.getElementById('apkUrl').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') startDownload();
    });

    // Auto-fill example URLs
    document.getElementById('apkUrl').addEventListener('focus', function() {
        if (this.value === 'app.apk') {
            this.value = '';
        }
    });
    </script>
</body>
</html>
